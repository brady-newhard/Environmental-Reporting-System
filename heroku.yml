build:
  languages:
    - python
    - nodejs
  packages:
    - libpq-dev
  scripts:
    - cd frontend && npm install && npm run build && cd ..
    - python manage.py collectstatic --noinput
run:
  web: gunicorn inspectionreports.wsgi --log-file - --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT 